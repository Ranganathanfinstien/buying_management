<script>
	window.sp = window.sp || {};
	sp.API = "universal_buying.www.supplier_portal_api.";
	sp.call = function (method, args) {
		return new Promise((resolve, reject) => {
			frappe.call({
				method: method.indexOf(".") > -1 ? method : sp.API + method,
				args: args || {},
				freeze: true,
				callback: (r) => resolve(r.message),
				error: (e) => reject(e),
			});
		});
	};
	sp.upload = async function (file) {
		const fd = new FormData();
		fd.append("file", file, file.name);
		fd.append("is_private", 1);
		const res = await fetch("/api/method/upload_file", {
			method: "POST",
			headers: { "X-Frappe-CSRF-Token": frappe.csrf_token, Accept: "application/json" },
			body: fd,
		});
		const data = await res.json();
		if (!res.ok || !data.message) {
			frappe.msgprint(__("Upload failed"));
			throw new Error("upload failed");
		}
		return data.message.file_url;
	};
	sp.form = function (el) {
		const out = {};
		new FormData(el).forEach((v, k) => { if (typeof v === "string") out[k] = v; });
		return out;
	};
</script>
